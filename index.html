<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Car Fighter: Series 8</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f5f5;
    --ink: #212121;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    outline: none; /* body is focusable (tabindex) for reliable keyboard capture; hide the focus ring */
  }
  #gameCanvas {
    display: block;
    background: var(--bg);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* ---------- Start Screen ---------- */
  #startScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    padding: 24px;
    box-sizing: border-box;
  }
  #startScreen .welcome-tag {
    font-size: clamp(10px, 1.8vw, 13px);
    letter-spacing: 2px;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 10px;
  }
  #startScreen h1 {
    font-size: clamp(18px, 4.4vw, 38px);
    letter-spacing: 3px;
    margin: 0 0 28px 0;
    color: var(--ink);
    line-height: 1.6;
  }
  #startScreen .byline {
    font-size: clamp(9px, 1.6vw, 12px);
    line-height: 2.2;
    max-width: 560px;
    color: var(--ink);
    opacity: 0.85;
    margin-bottom: 40px;
  }
  #startScreen .prompt {
    font-size: clamp(10px, 1.8vw, 13px);
    color: var(--ink);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--ink);
    z-index: 5;
    opacity: 0.75;
  }

  /* ---------- End-of-game panel ---------- */
  /* Hidden by default; JS adds .visible once the car is fully smashed. A
     small non-blocking corner panel rather than a full-screen modal --
     gameplay keeps going after the timer stops (Stefan stays controllable,
     the car stays hittable), so nothing should cover the view or eat
     input. Sits below the HUD's top-center clock, tucked to the right
     where it never overlaps the HUD text or the bottom-anchored touch
     controls. pointer-events is off on the panel itself (clicks/taps pass
     straight through to the game underneath) and re-enabled only on the
     restart button, the one interactive thing in it. */
  #endOverlay {
    display: none;
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(150px, 34vw, 220px);
    background: rgba(245, 245, 245, 0.92);
    border: 2px solid var(--ink);
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 20;
    padding: 12px 14px;
    box-sizing: border-box;
    pointer-events: none;
  }
  #endOverlay.visible {
    display: flex;
  }
  #endOverlay .end-title {
    font-size: clamp(10px, 1.8vw, 13px);
    letter-spacing: 2px;
    margin-bottom: 10px;
    color: var(--ink);
  }
  #endOverlay .end-stat {
    font-size: clamp(8px, 1.4vw, 10px);
    letter-spacing: 1px;
    line-height: 1.9;
    color: var(--ink);
    opacity: 0.85;
  }
  #endOverlay .end-stat .end-stat-value {
    opacity: 1;
  }
  #restartBtn {
    margin-top: 12px;
    font-family: inherit;
    font-size: clamp(8px, 1.4vw, 10px);
    letter-spacing: 1.5px;
    color: var(--bg);
    background: var(--ink);
    border: none;
    padding: 8px 14px;
    cursor: pointer;
    pointer-events: auto;
  }
  #restartBtn:hover {
    opacity: 0.85;
  }

  /* ---------- Mobile touch controls ---------- */
  /* Hidden by default; JS adds .visible only on touch-capable devices,
     so desktop play is completely unaffected. */
  /* Fully responsive layout: every size below derives from clamp()/vmin
     so the controls scale smoothly between small phones and large
     tablets instead of using fixed pixel values. vmin (the smaller of
     viewport width/height) is used rather than vw so the controls stay
     the same physical size whether the device is in portrait or
     landscape -- vw alone would balloon in landscape since width grows
     while thumb size doesn't. */
  #touchControls {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    /* Safe-area insets (notches/rounded corners) plus a comfortable
       responsive margin on top, so controls never sit under a notch
       or right at the physical screen edge on any device. */
    padding-left: calc(env(safe-area-inset-left, 0px) + clamp(16px, 5vmin, 40px));
    padding-right: calc(env(safe-area-inset-right, 0px) + clamp(16px, 5vmin, 40px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(12px, 4vmin, 28px));
    box-sizing: border-box;
    z-index: 10;
    justify-content: space-between; /* d-pad bottom-left, actions bottom-right */
    align-items: flex-end;
    pointer-events: none; /* re-enabled on the individual controls below */
    opacity: 0.92; /* sits gently into the minimalist scene rather than fighting the art */
  }
  #touchControls.visible {
    display: flex;
  }
  .tc-dpad {
    /* Group target: roughly 15-20% of the viewport's shorter side on
       typical phones/tablets (20vmin), floored at 120px so it's never
       too small to use comfortably on the smallest phones, and capped
       at 220px so it never dominates a large tablet screen. */
    --dpad: clamp(120px, 20vmin, 220px);
    position: relative;
    width: var(--dpad);
    height: var(--dpad);
    pointer-events: auto;
  }
  /* Each direction is its own real button: an invisible hit area sized
     at ~30% of the d-pad (generous tap target), with the visible
     rounded bar centered inside it -- the tappable area is bigger than
     what you see, for comfortable mobile tapping. The hit-area-to-gap
     ratio is preserved at every size since both scale off --dpad.
     Full opacity by default, dimmed to 50% while pressed (JS toggles
     .active -- see bindTouchButton); each button dims independently. */
  .tc-dir-btn {
    position: absolute;
    width: calc(var(--dpad) * 0.304);
    height: calc(var(--dpad) * 0.304);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .tc-dir {
    display: block;
    object-fit: contain; /* never stretched, whatever box it lands in */
    opacity: 1;
    pointer-events: none;
  }
  .tc-dir-btn.active .tc-dir {
    opacity: 0.5;
  }
  /* aspect-ratio locks each bar to the source graphic's true 4:1
     proportions (a 16x4 rounded rect) -- only one dimension is driven
     by --dpad and the other follows automatically, so the art can
     never be stretched or squashed at any screen size. */
  .tc-dir-btn.tc-left  .tc-dir,
  .tc-dir-btn.tc-right .tc-dir {
    width: calc(var(--dpad) * 0.304);
    height: auto;
    aspect-ratio: 4 / 1;
  }
  .tc-dir-btn.tc-left,
  .tc-dir-btn.tc-right {
    top: 50%;
    transform: translateY(-50%);
  }
  .tc-dir-btn.tc-left  { left: 0; }
  .tc-dir-btn.tc-right { right: 0; }
  /* Quarter-direction (diagonal) buttons: one small triangle per corner
     of the d-pad, sitting in each corner beyond the left/right cardinal
     bars. Reuses .tc-dir-btn for the same hit-area/flex-centring
     behaviour as the cardinals, and .tc-dir for the same active-press
     dimming -- only size, corner position, and icon rotation differ
     here. Each still sets its original up/down+left/right key pair on
     press (see data-key on the markup and bindTouchButton() below) for
     layout/positioning continuity, but since crouch/look-up were dropped
     from this build (see game logic), only the left/right half of that
     pair actually does anything -- pressing a diagonal button behaves
     exactly like pressing its adjacent cardinal left/right button. */
  .tc-dir-btn.tc-diag-btn {
    width: calc(var(--dpad) * 0.26);
    height: calc(var(--dpad) * 0.26);
  }
  .tc-dir-btn.tc-diag-btn .tc-dir {
    width: calc(var(--dpad) * 0.14);
    height: calc(var(--dpad) * 0.14);
  }
  .tc-dir-btn.tc-up-right   { top: 0; right: 0; }
  .tc-dir-btn.tc-down-right { bottom: 0; right: 0; }
  .tc-dir-btn.tc-down-left  { bottom: 0; left: 0; }
  .tc-dir-btn.tc-up-left    { top: 0; left: 0; }
  /* One triangle icon (pointing straight up in its source SVG), rotated
     45/135/225/315deg to point into each corner in turn -- up-right,
     down-right, down-left, up-left -- so only a single small triangle
     graphic needs to exist at all. */
  .tc-dir-btn.tc-up-right   .tc-dir { transform: rotate(45deg); }
  .tc-dir-btn.tc-down-right .tc-dir { transform: rotate(135deg); }
  .tc-dir-btn.tc-down-left  .tc-dir { transform: rotate(225deg); }
  .tc-dir-btn.tc-up-left    .tc-dir { transform: rotate(315deg); }
  /* Jump, Run, Punch, Kick: four identical circular buttons, arranged as
     two stacked rows -- Punch/Kick on top, Jump/Run underneath -- so the
     attack buttons sit within easier thumb reach above the movement
     buttons. Spacing scales with button size so they never feel cramped
     enough to risk an accidental press. Each is a small stack -- the
     stroke ring stays at full opacity always, while the fill button dims
     to 50% while pressed. */
  .tc-actions {
    --action: clamp(44px, 9vmin, 72px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--action) * 0.35);
    pointer-events: auto;
  }
  .tc-actions-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: calc(var(--action) * 0.5);
  }
  .tc-action-btn {
    position: relative;
    width: var(--action);
    height: var(--action);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .tc-btn-stroke {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1; /* button-stroke.svg is a true circle -- never stretched */
    object-fit: contain;
    opacity: 1; /* always full opacity, regardless of press state */
    pointer-events: none;
  }
  .tc-btn-fill {
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(var(--action) * 0.84); /* matches button.svg's 20/24 ratio against the stroke */
    height: calc(var(--action) * 0.84);
    aspect-ratio: 1 / 1; /* button.svg is a true circle -- never stretched */
    object-fit: contain;
    transform: translate(-50%, -50%);
    opacity: 1;
    pointer-events: none;
  }
  .tc-action-btn.active .tc-btn-fill {
    opacity: 0.5;
  }
</style>
</head>

<script>
(function() {
  "use strict";

  // ---------------------------------------------------------------
  // Super Car Fighter: Series 8 -- a focused spin-off built from The White
  // Space's engine: just Stefan, one car, and a fight. No door, no rain,
  // no trips/falls/limping, no sad-walk, no fatigue drift, no south
  // wander-off -- every one of those existed to flesh out a slower
  // exploration game, and none of them fit a tight arcade "smash the car
  // as fast as you can" loop. Movement/punch/kick and the car's own
  // damage model are carried over close to verbatim from that game.
  //
  // Character art was later replaced wholesale (Character.zip) with a new
  // sprite pack that only covers walk/run/running-jump/punches/kicks/
  // fight-stance plus one static standing pose -- it has no crouch, no
  // standing jump, and no look-up art, so those three controls (and the
  // old phone/worn-out idle mood variety, which also has no equivalent)
  // were dropped rather than mixed with mismatched old art. Movement,
  // running jump, and fighting are otherwise unchanged.
  // ---------------------------------------------------------------

  // ---------------------------------------------------------------
  // Setup canvas
  // ---------------------------------------------------------------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const BG = '#f5f5f5';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function grabFocus() {
    try { window.focus(); } catch (err) {}
    try { document.body.focus(); } catch (err) {}
  }
  grabFocus();
  window.addEventListener('load', grabFocus);
  document.addEventListener('click', grabFocus);
  document.addEventListener('touchstart', grabFocus);

  // ---------------------------------------------------------------
  // Sprite pool -- SPRITE_POOL/SPRITES_RAW are injected as a separate
  // <script> block ahead of this one (see sprite_pool_tools.save_pool()).
  // Only the keys this stripped-down game actually uses are in the pool
  // at all -- see the asset-build step that assembled this HTML.
  // ---------------------------------------------------------------
  const SPRITE_IMAGES = SPRITE_POOL.map(function(dataUri) {
    const img = new Image();
    img.src = dataUri;
    return img;
  });

  const ANIMS = {};
  Object.keys(SPRITES_RAW).forEach(function(key) {
    ANIMS[key] = SPRITES_RAW[key].map(function(poolIndex) {
      return SPRITE_IMAGES[poolIndex];
    });
  });

  // ---------------------------------------------------------------
  // Animation config -- east/west walk+run, running jump, the four
  // fighting moves (flying_kick now drawn from the new pack's
  // Roundhouse_Kick art, the closest match to the old move), and the
  // fight-stance loop they resolve into. stand_south is a single static
  // pose (idle/rotations/south.png in the new pack) -- what every action
  // settles onto once it finishes and nothing else is held. No crouch, no
  // standing jump, no look-up, no idle mood variety -- see the header
  // comment. No south-facing walk/run art either -- south was only ever
  // the old wander-off flavor, which doesn't exist here.
  // ---------------------------------------------------------------
  const ANIM_CONFIG = {
    walk_east:            { fps: 8,  loop: true  },
    walk_west:            { fps: 8,  loop: true  },
    running_east:         { fps: 14, loop: true  },
    running_west:         { fps: 14, loop: true  },
    stand_south:          { fps: 1,  loop: true  },
    running_jump_east:    { fps: 16, loop: false },
    running_jump_west:    { fps: 16, loop: false },
    cross_punch_east:     { fps: 14, loop: false },
    cross_punch_west:     { fps: 14, loop: false },
    lead_jab_east:        { fps: 14, loop: false },
    lead_jab_west:        { fps: 14, loop: false },
    high_kick_east:       { fps: 14, loop: false },
    high_kick_west:       { fps: 14, loop: false },
    flying_kick_east:     { fps: 14, loop: false },
    flying_kick_west:     { fps: 14, loop: false },
    fight_stance_idle_east: { fps: 8, loop: true },
    fight_stance_idle_west: { fps: 8, loop: true },
    // Victory pose: a one-shot celebration (south-facing only, no east/
    // west art) played once the car reaches its final stage -- see
    // triggerGameEnd(). Not looped; resolves back to stand_south once it
    // finishes (see animate()), handing control straight back so Stefan
    // stays fully playable afterward.
    victory_south:        { fps: 8,  loop: false },
  };

  // West-facing art is a horizontal mirror of east for every pair here --
  // only "_east" ships real art in the pool; "_west" is aliased onto the
  // same Image objects and drawn flipped (see drawCharacterFrame()).
  Object.keys(ANIM_CONFIG).forEach(function(key) {
    if (ANIMS[key]) return;
    if (key.endsWith('_west')) {
      const eastKey = key.slice(0, -'_west'.length) + '_east';
      if (ANIMS[eastKey]) ANIMS[key] = ANIMS[eastKey];
    }
  });

  // ---------------------------------------------------------------
  // Pools
  // ---------------------------------------------------------------
  const PUNCH_VARIANTS = ['cross_punch', 'lead_jab'];

  function pickVariant(pool) {
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ---------------------------------------------------------------
  // Action-family checks
  // ---------------------------------------------------------------
  function isRunningAction(action) {
    return action.indexOf('running_') === 0;
  }
  function isWalkOrRunAction(action) {
    return action.indexOf('walk_') === 0 || isRunningAction(action);
  }
  function isMovingEastWest(action) {
    return isWalkOrRunAction(action) || action.indexOf('flying_kick_') === 0;
  }
  // Only running_jump and its flying_kick redirect count as "airborne"
  // now -- the standing jump variants (jump_a/jump_b) were dropped along
  // with crouch and look-up (see header comment), since the new character
  // art has no equivalent for any of the three.
  function isJumpAction(action) {
    return action.indexOf('running_jump_') === 0 || action.indexOf('flying_kick_') === 0;
  }
  function isPunchAction(action) {
    return action.indexOf('cross_punch_') === 0 || action.indexOf('lead_jab_') === 0;
  }
  function isKickAction(action) {
    return action.indexOf('high_kick_') === 0 || action.indexOf('flying_kick_') === 0;
  }
  function isVictoryAction(action) {
    return action === 'victory_south';
  }

  // ---------------------------------------------------------------
  // Character state
  // ---------------------------------------------------------------
  // Root scale for the whole scene -- character size, hit-range half-width,
  // and the character's own shadow all derive from this one value. Base is
  // the animations.zip art's native frame size (256x256); CHARACTER_SCALE
  // then bumps everything up from there uniformly.
  const CHARACTER_SCALE = 1.5 * 1.2;
  const DISPLAY_SIZE = 256 * CHARACTER_SCALE;
  const WALK_SPEED = 140;
  const RUN_SPEED = 300;
  // Stefan's own body half-width for hit-range purposes -- re-measured
  // against the animations.zip fight-stance pose (its actual opaque
  // pixels: halfw ~0.0898 of the 256px frame), a more representative
  // "combat ready" width than his plain walking stride was -- see
  // carHitHalfWidths(). This new art pack's character occupies a
  // noticeably smaller fraction of its frame than the previous set did.
  const CHARACTER_COLLISION_HALF_WIDTH = DISPLAY_SIZE * 0.0898;
  const GROUND_Y_FRAC = 0.62;

  // Ground shadow -- a simple two-tone soft ellipse under Stefan's feet.
  // SHADOW_Y_FRAC also anchors the car's own ground-contact line (see
  // groundContactY()) -- left as-is so the car's own tuned vertical
  // position doesn't shift. CHARACTER_SHADOW_Y_FRAC is Stefan's own,
  // separate value, re-measured against the new south.png art's actual
  // foot position (its alpha bounding box's bottom edge sits at ~0.648 of
  // its own 256px frame, i.e. 0.148 below the frame's vertical centre --
  // now that stand_south finally matches the rest of animations.zip's
  // proportions, this lines up with walk/run/idle instead of the old,
  // much-more-padded standing pose it replaced).
  const SHADOW_Y_FRAC = 112 / 480;
  const CHARACTER_SHADOW_Y_FRAC = 0.148;
  // Re-measured against the new south.png art's own footprint (halfw
  // ~0.074 of DISPLAY_SIZE) -- the 70/480, 45/480 fractions above were
  // tuned for the old, much thicker character and left the shadow reading
  // roughly 2x wider than the new, slimmer one. Outer edge sits just past
  // the body's own width, inner core a bit inside it.
  const SHADOW_OUTER_RX_FRAC = 0.078;
  const SHADOW_OUTER_RY_FRAC = 0.013;
  const SHADOW_INNER_RX_FRAC = 0.052;
  const SHADOW_INNER_RY_FRAC = 0.009;
  const SHADOW_OUTER_COLOR = 'rgb(40,32,28)';
  const SHADOW_OUTER_ALPHA = 0.22;
  const SHADOW_INNER_COLOR = 'rgb(30,24,20)';
  const SHADOW_INNER_ALPHA = 0.37;
  const SHADOW_HEIGHT_REF = 200;
  const SHADOW_MIN_SCALE = 0.35;
  const SHADOW_MIN_ALPHA_MUL = 0.3;

  function fillEllipse(x, y, rx, ry, color, alpha) {
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGroundShadow(x, heightAboveGround, size) {
    size = size || DISPLAY_SIZE;
    const t = Math.max(0, Math.min(1, heightAboveGround / SHADOW_HEIGHT_REF));
    const scale = 1 - t * (1 - SHADOW_MIN_SCALE);
    const alphaMul = 1 - t * (1 - SHADOW_MIN_ALPHA_MUL);
    const groundY = canvas.height * GROUND_Y_FRAC;
    const shadowCy = groundY + size * CHARACTER_SHADOW_Y_FRAC;
    ctx.save();
    fillEllipse(x, shadowCy, size * SHADOW_OUTER_RX_FRAC * scale, size * SHADOW_OUTER_RY_FRAC * scale, SHADOW_OUTER_COLOR, SHADOW_OUTER_ALPHA * alphaMul);
    fillEllipse(x, shadowCy, size * SHADOW_INNER_RX_FRAC * scale, size * SHADOW_INNER_RY_FRAC * scale, SHADOW_INNER_COLOR, SHADOW_INNER_ALPHA * alphaMul);
    ctx.restore();
  }

  // INTRO_STOP_OFFSET_PX: how far left of the car's centre Stefan stops
  // once he's walked on -- outside the car's hit range (see
  // carHitHalfWidths()), so closing the last stretch is a deliberate
  // press of his own rather than instant contact the moment control
  // hands off.
  const INTRO_STOP_OFFSET_PX = 320;

  const character = {
    x: -DISPLAY_SIZE / 2, // starts fully off-screen left -- see introUpdate(), which walks him on
    facing: 'east',
    action: 'walk_east',
    frameIndex: 0,
    frameTimer: 0,
    jumpHeight: 70,
    fightStanceTimer: 0,
    fightStanceThreshold: 0
  };

  // ---------------------------------------------------------------
  // Intro: Stefan walks on from off-screen left and stops a short
  // distance from the car (which is already sitting in position -- see
  // the car spawn right below). Once he reaches his stop point, control
  // hands off and the timer starts. No sky-fall, no cutscene state
  // machine -- just a plain walk using the exact same WALK_SPEED/
  // walk_east art normal gameplay uses, so it reads as the very first
  // beat of ordinary movement rather than a separate mode.
  // ---------------------------------------------------------------
  let introPlaying = true;

  function introUpdate(dt) {
    character.x += WALK_SPEED * dt;
    const targetX = canvas.width / 2 - INTRO_STOP_OFFSET_PX;
    if (character.x >= targetX) {
      character.x = targetX;
      introPlaying = false;
      setAction('stand_south');
      startTime = Date.now(); // the timer starts once Stefan actually has control
    }
  }

  function setAction(action) {
    if (character.action === action) return;
    character.action = action;
    character.frameIndex = 0;
    character.frameTimer = 0;
    if (action === 'fight_stance_idle_east' || action === 'fight_stance_idle_west') {
      character.fightStanceTimer = 0;
      character.fightStanceThreshold = FIGHT_STANCE_HOLD_MIN_SEC + Math.random() * (FIGHT_STANCE_HOLD_MAX_SEC - FIGHT_STANCE_HOLD_MIN_SEC);
    }
  }

  function applyWalkPress(isLeft, shiftHeld) {
    character.facing = isLeft ? 'west' : 'east';
    setAction((shiftHeld ? 'running_' : 'walk_') + character.facing);
  }

  const FIGHT_STANCE_HOLD_MIN_SEC = 5;
  const FIGHT_STANCE_HOLD_MAX_SEC = 10;

  // ---------------------------------------------------------------
  // Input handling
  // ---------------------------------------------------------------
  const keys = {
    left: false, right: false, down: false, up: false, space: false, shift: false,
    punch: false, kick: false
  };

  let gameStarted = false;

  function beginGame() {
    if (gameStarted) return;
    gameStarted = true;
    document.getElementById('startScreen').style.display = 'none';
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function(e) {
    if (!gameStarted) { beginGame(); return; }
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': keys.left = true; e.preventDefault(); break;
      case 'ArrowRight': case 'KeyD': keys.right = true; e.preventDefault(); break;
      case 'ArrowDown': case 'KeyS': keys.down = true; e.preventDefault(); break;
      case 'ArrowUp': case 'KeyW': keys.up = true; e.preventDefault(); break;
      case 'Space': keys.space = true; e.preventDefault(); break;
      case 'ShiftLeft': case 'ShiftRight': keys.shift = true; break;
      case 'KeyJ': keys.punch = true; e.preventDefault(); break;
      case 'KeyK': keys.kick = true; e.preventDefault(); break;
    }
  });

  window.addEventListener('keyup', function(e) {
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': keys.left = false; break;
      case 'ArrowRight': case 'KeyD': keys.right = false; break;
      case 'ArrowDown': case 'KeyS': keys.down = false; break;
      case 'ArrowUp': case 'KeyW': keys.up = false; break;
      case 'Space': keys.space = false; break;
      case 'ShiftLeft': case 'ShiftRight': keys.shift = false; break;
      case 'KeyJ': keys.punch = false; break;
      case 'KeyK': keys.kick = false; break;
    }
  });

  document.getElementById('startScreen').addEventListener('click', beginGame);
  document.getElementById('startScreen').addEventListener('touchstart', beginGame);

  // ---------------------------------------------------------------
  // Mobile touch controls -- same d-pad + jump/run/punch/kick action
  // buttons as the base game, unchanged: each just sets the same
  // `keys.*` flags the keyboard handlers use.
  // ---------------------------------------------------------------
  const touchControls = document.getElementById('touchControls');
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouchDevice && touchControls) {
    touchControls.classList.add('visible');
  }

  function bindTouchButton(el) {
    const keyNames = el.getAttribute('data-key').split(' ');
    function press(e) {
      e.preventDefault();
      el.classList.add('active');
      if (!gameStarted) { beginGame(); return; }
      keyNames.forEach(function(k) { keys[k] = true; });
      grabFocus();
    }
    function release(e) {
      e.preventDefault();
      el.classList.remove('active');
      keyNames.forEach(function(k) { keys[k] = false; });
    }
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  }
  if (touchControls) {
    const buttons = touchControls.querySelectorAll('[data-key]');
    for (let i = 0; i < buttons.length; i++) bindTouchButton(buttons[i]);
  }

  // ---------------------------------------------------------------
  // Timer
  // ---------------------------------------------------------------
  let startTime = null;
  const hud = document.getElementById('hud');

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  // ---------------------------------------------------------------
  // Scoring + game end -- the whole game is "how fast can you smash the
  // car". Once it's fully destroyed the game ends: the wreck stays right
  // there, still smoking, and an overlay shows the final time and score.
  // Faster times score higher, floored at SCORE_MIN so a slow run still
  // earns something.
  // ---------------------------------------------------------------
  const SCORE_BASE = 1000;
  const SCORE_PENALTY_PER_SEC = 8;
  const SCORE_MIN = 50;

  function computeScore(timeSec) {
    return Math.max(SCORE_MIN, Math.round(SCORE_BASE - SCORE_PENALTY_PER_SEC * timeSec));
  }

  let gameEnded = false;
  let finalTimeSec = 0;
  let finalScore = 0;

  function showEndOverlay() {
    const overlay = document.getElementById('endOverlay');
    const timeEl = document.getElementById('endTime');
    const scoreEl = document.getElementById('endScore');
    if (timeEl) timeEl.textContent = formatTime(finalTimeSec * 1000);
    if (scoreEl) scoreEl.textContent = String(finalScore);
    if (overlay) overlay.classList.add('visible');
  }

  function triggerGameEnd() {
    if (gameEnded) return;
    gameEnded = true;
    finalTimeSec = startTime ? (Date.now() - startTime) / 1000 : 0;
    finalScore = computeScore(finalTimeSec);
    showEndOverlay();
    setAction('victory_south');
  }

  const restartBtn = document.getElementById('restartBtn');
  if (restartBtn) {
    restartBtn.addEventListener('click', function() {
      location.reload();
    });
  }

  // ---------------------------------------------------------------
  // Car Smash -- the entire game. One car, already sitting in position
  // from the very first frame (see the spawn right below), takes damage
  // from Stefan's punches/kicks whenever he's close enough, and visibly
  // falls apart in stages. Once fully destroyed the game ends (see
  // triggerGameEnd()) -- it never slides off or resets.
  //
  // Damage model: 9 flat, unsplit frames, car_1..car_9, one per
  // overallStage. overallStage climbs by one every CAR_HITS_PER_STAGE
  // hits from either side interchangeably -- EXCEPT the very last step,
  // which additionally needs both sides to have landed at least one hit
  // at some point (car.hitLeftEver/hitRightEver), so finishing it off
  // needs Stefan to have worked both sides at some point, not necessarily
  // right at the end.
  // ---------------------------------------------------------------
  // Car Frames.zip art: 133x86 native, drawn at CAR_DISPLAY_SCALE (1.0 =
  // actual pixel size; bumped up from there to scale the car up like the
  // rest of the scene). Its shadow shares this same scale (see
  // CAR_SHADOW_DISPLAY_WIDTH/HEIGHT below), so both grow together.
  const CAR_NATIVE_WIDTH = 133;
  const CAR_NATIVE_HEIGHT = 86;
  const CAR_DISPLAY_SCALE = 1.5 * 1.1 * 1.1 * 1.2;
  const CAR_DISPLAY_WIDTH = CAR_NATIVE_WIDTH * CAR_DISPLAY_SCALE;
  const CAR_DISPLAY_HEIGHT = CAR_NATIVE_HEIGHT * CAR_DISPLAY_SCALE;

  // A single static ground-shadow image, drawn beneath the car at every
  // damage stage (unlike car_1..car_9, this one never swaps) -- always
  // present, from the very first frame straight through the wreck. Its
  // native width (133) matches the car art's own native width exactly, so
  // it shares CAR_DISPLAY_SCALE rather than getting its own independent
  // scale, keeping it sized proportionally to the car at every screen
  // size.
  const CAR_SHADOW_NATIVE_WIDTH = 133;
  const CAR_SHADOW_NATIVE_HEIGHT = 69;
  const CAR_SHADOW_DISPLAY_WIDTH = CAR_SHADOW_NATIVE_WIDTH * CAR_DISPLAY_SCALE;
  const CAR_SHADOW_DISPLAY_HEIGHT = CAR_SHADOW_NATIVE_HEIGHT * CAR_DISPLAY_SCALE;
  // Nudges the shadow up off the car's exact ground-contact line -- a
  // fraction of its own display height, so the adjustment scales with the
  // car's own on-screen size rather than being a fixed pixel amount.
  const CAR_SHADOW_Y_OFFSET = CAR_SHADOW_DISPLAY_HEIGHT * 0.45;

  const CAR_FINAL_STAGE = 9;
  const CAR_SHAKE_DURATION = 0.22;
  const CAR_SHAKE_MAGNITUDE = 7;
  const CAR_FLASH_DURATION = 0.12;
  const CAR_RECOIL_DURATION = 0.18;
  const CAR_RECOIL_DISTANCE = 10;
  const CAR_PARTICLE_COUNT = 10;
  const CAR_SCREEN_SHAKE_MAGNITUDE = 5;
  // Broken glass shards -- real sprite-cycle art (Glass.zip: three
  // distinct tumbling shard cycles, glass1/glass2/glass3, each with its
  // own native pixel size), not procedural shapes. Only kicked off the car
  // on landed hits while it's mid-damage (stages 5-7, where the windows
  // would plausibly be starting to go), and even then only sometimes --
  // CAR_GLASS_SPAWN_CHANCE keeps it an occasional accent rather than
  // something on every single hit. Each spawned shard pops outward off the
  // car, then arcs down toward the ground under gravity and fades out
  // before it "lands" -- see spawnCarGlassShards()/updateCars().
  const CAR_GLASS_START_STAGE = 5;
  const CAR_GLASS_END_STAGE = 7;
  const CAR_GLASS_SPAWN_CHANCE = 0.35;
  const CAR_GLASS_SHARD_COUNT = 3;
  const GLASS_CYCLE_KEYS = ['glass1', 'glass2', 'glass3'];
  const GLASS_CYCLE_FRAME_COUNTS = { glass1: 4, glass2: 3, glass3: 3 };
  // Native pixel size per cycle, times GLASS_DISPLAY_SCALE (applied at
  // draw time -- see drawCar()) to scale shards up along with everything
  // else rather than pinning them to literal 1:1 source pixels forever.
  const GLASS_DISPLAY_SCALE = 1.5 * 1.2;
  const GLASS_NATIVE_SIZE = {
    glass1: { w: 14, h: 16 },
    glass2: { w: 8, h: 10 },
    glass3: { w: 6, h: 7 }
  };
  const GLASS_ANIM_FPS = 10;
  // How many landed hits it takes to advance overallStage by one -- bumped
  // up from the base game's 3 so a full run takes meaningfully longer,
  // per the brief ("make it take longer to smash the car").
  const CAR_HITS_PER_STAGE = 5;
  // Ambient smoke + sparks -- a light touch, only across the mid-damage
  // stages (5-8). It stops spawning new puffs once the car reaches
  // CAR_FINAL_STAGE (9) -- that's when the two spray cycles take over as
  // the end state's visual instead (see SPRAY_* below); any smoke
  // particles already in flight just finish their own natural fade.
  // Smoke New.zip's 9 frames are a self-contained puff cycle (already
  // "grown" in the art itself), drawn at a fixed size the whole time a
  // puff is alive -- no procedural size-growth on top. Unlike the earlier
  // smoke.zip (a 192x192 canvas, over 2x the car's own native height --
  // drawing that literally dwarfed the car), this pack was drawn directly
  // at car scale (21x26 native, non-square), so 100% actual size is
  // correct here without any extra scaling.
  const CAR_SMOKE_START_STAGE = 5;
  const CAR_SMOKE_END_STAGE = 8;
  const CAR_SMOKE_SPAWN_INTERVAL = 0.32;
  const SMOKE_FRAME_COUNT = 9;
  const SMOKE_ANIM_FPS = 10;
  const SMOKE_NATIVE_WIDTH = 21;
  const SMOKE_NATIVE_HEIGHT = 26;
  // Applied at spawn time (see spawnCarSmoke()) so puffs scale up along
  // with everything else rather than staying pinned to literal 1:1 source
  // pixels forever.
  const SMOKE_DISPLAY_SCALE = 1.5 * 1.2;
  const SMOKE_DISPLAY_WIDTH = SMOKE_NATIVE_WIDTH * SMOKE_DISPLAY_SCALE;
  const SMOKE_DISPLAY_HEIGHT = SMOKE_NATIVE_HEIGHT * SMOKE_DISPLAY_SCALE;

  // Two independent 3-frame "spray" cycles baked into the same 133x86
  // canvas as the car art itself (measured bounding boxes confirm they're
  // small bursts positioned on the car's own silhouette), so they're drawn
  // with the exact same drawX/baseY/CAR_DISPLAY_WIDTH/CAR_DISPLAY_HEIGHT as
  // the car sprite -- no separate positioning math needed. They only ever
  // appear once the car has reached CAR_FINAL_STAGE (frame 9), loop
  // forever from there, and each gets its own randomized starting frame
  // and slightly jittered fps (rolled once, when the car first reaches the
  // final stage) so the two loops read as independent and drift in and out
  // of sync rather than mirroring each other in lockstep.
  const SPRAY_FRAME_COUNT = 3;
  const SPRAY_ANIM_FPS_BASE = 6;
  const SPRAY_ANIM_FPS_JITTER = 0.35;

  // Re-measured against the Car Frames.zip art (alpha>10 bounding box,
  // fraction of native 133x86): stages 1-8 share one flat unsplit sheet
  // (the car sits in the same footprint the whole way through), and stage
  // 9 -- now the true end frame -- is cropped slightly tighter and offset
  // left, matching its damaged silhouette.
  const CAR_METRICS_DEFAULT = { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 };
  const CAR_METRICS = {
    car_1: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_2: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_3: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_4: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_5: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_6: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_7: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_8: { top: 0.0000, bottom: 0.9767, left: 0.0000, right: 1.0000 },
    car_9: { top: 0.0581, bottom: 1.0000, left: 0.0000, right: 0.9398 }
  };

  function carArtKeys(car) {
    return ['car_' + car.overallStage];
  }

  function carMetrics(car) {
    const keys = carArtKeys(car);
    let top = Infinity, bottom = -Infinity, left = Infinity, right = -Infinity;
    for (const key of keys) {
      const m = CAR_METRICS[key] || CAR_METRICS_DEFAULT;
      top = Math.min(top, m.top);
      bottom = Math.max(bottom, m.bottom);
      left = Math.min(left, m.left);
      right = Math.max(right, m.right);
    }
    return { top: top, bottom: bottom, left: left, right: right };
  }

  // A small fixed upward nudge off Stefan's own ground line -- applied
  // here since this is the one shared anchor point both the car sprite
  // (via carBaseY()) and its shadow are built from, so adjusting it here
  // moves both together by the same amount.
  const CAR_GROUND_Y_NUDGE = 40;

  function groundContactY(groundY) {
    return groundY + DISPLAY_SIZE * SHADOW_Y_FRAC - CAR_GROUND_Y_NUDGE;
  }

  function carBaseY(car, groundY) {
    const m = carMetrics(car);
    return groundContactY(groundY) - CAR_DISPLAY_HEIGHT * m.bottom;
  }

  function carHalfWidths(car) {
    const m = carMetrics(car);
    return {
      west: CAR_DISPLAY_WIDTH * (0.5 - m.left),
      east: CAR_DISPLAY_WIDTH * (m.right - 0.5)
    };
  }

  function carHitHalfWidths(car) {
    const hw = carHalfWidths(car);
    return {
      west: hw.west + CHARACTER_COLLISION_HALF_WIDTH,
      east: hw.east + CHARACTER_COLLISION_HALF_WIDTH
    };
  }

  // One car, spawned immediately (module load), already centred and
  // "in position" -- no slide-in, no exploration pacing. Stefan walks
  // into a scene where it's already sitting there.
  function createCar() {
    return {
      screenX: canvas.width / 2,
      overallStage: 1,
      stageHits: 0,
      hitLeftEver: false,
      hitRightEver: false,
      shakeTimer: 0,
      flashTimer: 0,
      recoilTimer: 0,
      recoilDir: 1,
      particles: [],
      glassParticles: [],
      smokeParticles: [],
      smokeSpawnTimer: 0,
      sprayInited: false,
      spray1Frame: 0,
      spray1Timer: 0,
      spray1Fps: SPRAY_ANIM_FPS_BASE,
      spray2Frame: 0,
      spray2Timer: 0,
      spray2Fps: SPRAY_ANIM_FPS_BASE
    };
  }

  const cars = [createCar()];

  function carFullyDestroyed(car) {
    return car.overallStage >= CAR_FINAL_STAGE;
  }

  function carScreenX(car) {
    return car.screenX;
  }

  function carHitSide(car) {
    return character.x < car.screenX ? 'left' : 'right';
  }

  function spawnCarHitParticles(car, side) {
    const originX = carScreenX(car) + (side === 'left' ? -CAR_DISPLAY_WIDTH * 0.2 : CAR_DISPLAY_WIDTH * 0.2);
    const m = carMetrics(car);
    const originY = carBaseY(car, canvas.height * GROUND_Y_FRAC) + CAR_DISPLAY_HEIGHT * ((m.top + m.bottom) / 2);
    for (let i = 0; i < CAR_PARTICLE_COUNT; i++) {
      const isSpark = i % 2 === 0;
      const angle = Math.random() * Math.PI * 2;
      const speed = isSpark ? 140 + Math.random() * 160 : 30 + Math.random() * 40;
      car.particles.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (isSpark ? 60 : 20),
        life: 0,
        maxLife: isSpark ? 0.18 + Math.random() * 0.12 : 0.5 + Math.random() * 0.3,
        isSpark: isSpark,
        size: isSpark ? 2 + Math.random() * 2 : 5 + Math.random() * 6
      });
    }
  }

  // Just a few real glass-cycle sprites per burst -- kept deliberately
  // sparse (see CAR_GLASS_SHARD_COUNT) so it reads as an accent, not a
  // shower. Shares the same origin math as spawnCarHitParticles() (roughly
  // where a fist would be landing on that side of the car). Each shard
  // pops outward off the car with a small kick, then gravity takes over
  // (see its physics in updateCars()) and it arcs down toward the ground,
  // fading out before it "lands" -- it never actually needs to hit an
  // exact ground pixel, it just vanishes on schedule.
  function spawnCarGlassShards(car, side) {
    const originX = carScreenX(car) + (side === 'left' ? -CAR_DISPLAY_WIDTH * 0.2 : CAR_DISPLAY_WIDTH * 0.2);
    const m = carMetrics(car);
    const originY = carBaseY(car, canvas.height * GROUND_Y_FRAC) + CAR_DISPLAY_HEIGHT * ((m.top + m.bottom) / 2);
    const dir = side === 'left' ? -1 : 1;
    for (let i = 0; i < CAR_GLASS_SHARD_COUNT; i++) {
      const key = GLASS_CYCLE_KEYS[Math.floor(Math.random() * GLASS_CYCLE_KEYS.length)];
      car.glassParticles.push({
        key: key,
        x: originX, y: originY,
        vx: dir * (30 + Math.random() * 50) + (Math.random() * 2 - 1) * 15,
        vy: -(50 + Math.random() * 60),
        life: 0,
        maxLife: 0.7 + Math.random() * 0.5,
        frame: Math.floor(Math.random() * GLASS_CYCLE_FRAME_COUNTS[key]),
        frameTimer: Math.random() / GLASS_ANIM_FPS,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 2 - 1) * 6
      });
    }
  }

  function spawnCarSmoke(car) {
    const m = carMetrics(car);
    const groundY = canvas.height * GROUND_Y_FRAC;
    const baseY = carBaseY(car, groundY);
    // Originates from the centre of the car artwork (both axes), with a
    // small jitter so consecutive puffs don't stack on the exact same
    // pixel.
    const originX = carScreenX(car) + (Math.random() * 2 - 1) * CAR_DISPLAY_WIDTH * 0.08;
    const originY = baseY + CAR_DISPLAY_HEIGHT * ((m.top + m.bottom) / 2);

    car.smokeParticles.push({
      x: originX, y: originY,
      vx: (Math.random() * 2 - 1) * 10,
      vy: -18 - Math.random() * 14,
      driftSeed: Math.random() * 10,
      life: 0,
      maxLife: 1.0 + Math.random() * 0.7,
      // Fixed at the sprite's own native pixel dimensions (100% actual
      // size, already drawn at car scale) for its whole lifetime -- the
      // puff's own growth/dissipation is already baked into its 9-frame
      // cycle, no procedural size animation needed.
      w: SMOKE_DISPLAY_WIDTH,
      h: SMOKE_DISPLAY_HEIGHT,
      peakAlpha: 0.55 + Math.random() * 0.3,
      isSpark: false,
      frame: Math.floor(Math.random() * SMOKE_FRAME_COUNT),
      frameTimer: Math.random() / SMOKE_ANIM_FPS
    });

    if (Math.random() < 0.18) {
      const angle = -Math.PI / 2 + (Math.random() * 2 - 1) * 0.9;
      const speed = 60 + Math.random() * 90;
      car.smokeParticles.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0,
        maxLife: 0.12 + Math.random() * 0.1,
        size: 1.5 + Math.random() * 1.5,
        peakAlpha: 1,
        isSpark: true
      });
    }
  }

  // Short, punchy procedurally synthesized impact thud+crunch via Web
  // Audio -- no audio asset needed. Fully self-guarding for environments
  // without Web Audio (including the headless test harness).
  let carAudioCtx = null;
  function playCarHitSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!carAudioCtx) carAudioCtx = new Ctx();
      const ctxA = carAudioCtx;
      const now = ctxA.currentTime;

      const thump = ctxA.createOscillator();
      const thumpGain = ctxA.createGain();
      thump.type = 'square';
      thump.frequency.setValueAtTime(160, now);
      thump.frequency.exponentialRampToValueAtTime(45, now + 0.12);
      thumpGain.gain.setValueAtTime(0.5, now);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      thump.connect(thumpGain);
      thumpGain.connect(ctxA.destination);
      thump.start(now);
      thump.stop(now + 0.16);

      const bufferSize = Math.max(1, Math.floor(ctxA.sampleRate * 0.15));
      const noiseBuffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      const noise = ctxA.createBufferSource();
      noise.buffer = noiseBuffer;
      const noiseFilter = ctxA.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 900;
      const noiseGain = ctxA.createGain();
      noiseGain.gain.setValueAtTime(0.35, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(ctxA.destination);
      noise.start(now);
    } catch (err) {
      // Web Audio unavailable/blocked -- the hit still lands visually.
    }
  }

  // Applies one hit to `car` from `side` -- the only place car damage
  // state changes. The finishing hit (the one that reaches
  // CAR_FINAL_STAGE) ends the game -- see triggerGameEnd(). Hits keep
  // landing (shake/flash/particles/sound) even after the game has
  // officially ended -- the timer/score are already locked in by
  // triggerGameEnd()'s own idempotent guard, but the wreck itself stays
  // fully punchable/kickable for as long as the player wants to keep
  // hitting it.
  function registerCarHit(car, side) {
    if (side === 'left') car.hitLeftEver = true; else car.hitRightEver = true;

    car.stageHits++;
    if (car.stageHits >= CAR_HITS_PER_STAGE) {
      const readyForFinalStage = car.overallStage < CAR_FINAL_STAGE - 1 || (car.hitLeftEver && car.hitRightEver);
      if (readyForFinalStage) {
        car.overallStage = Math.min(CAR_FINAL_STAGE, car.overallStage + 1);
        car.stageHits = 0;
      } else {
        car.stageHits = CAR_HITS_PER_STAGE - 1;
      }
    }

    car.shakeTimer = CAR_SHAKE_DURATION;
    car.flashTimer = CAR_FLASH_DURATION;
    car.recoilTimer = CAR_RECOIL_DURATION;
    car.recoilDir = side === 'left' ? -1 : 1;
    spawnCarHitParticles(car, side);
    if (car.overallStage >= CAR_GLASS_START_STAGE && car.overallStage <= CAR_GLASS_END_STAGE
      && Math.random() < CAR_GLASS_SPAWN_CHANCE) {
      spawnCarGlassShards(car, side);
    }
    playCarHitSound();

    if (carFullyDestroyed(car)) {
      triggerGameEnd();
    }
  }

  // Checked from update()'s punch/kick trigger sites. A hit lands once
  // Stefan's real body is actually close enough to be touching the car's
  // real silhouette (see carHitHalfWidths()) -- no separate reach
  // allowance, and no wall/collision either; Stefan can freely walk
  // through the car in either direction, this is purely a proximity
  // check for landing a hit.
  function checkCarHits() {
    for (const car of cars) {
      const hw = carHitHalfWidths(car);
      const rel = car.screenX - character.x;
      if (rel <= hw.west && rel >= -hw.east) {
        registerCarHit(car, carHitSide(car));
      }
    }
  }

  function currentScreenShakeOffset() {
    let strongest = 0;
    for (const car of cars) {
      const t = car.shakeTimer / CAR_SHAKE_DURATION;
      if (t > strongest) strongest = t;
    }
    if (strongest <= 0) return { x: 0, y: 0 };
    const mag = CAR_SCREEN_SHAKE_MAGNITUDE * strongest;
    return { x: (Math.random() * 2 - 1) * mag, y: (Math.random() * 2 - 1) * mag };
  }

  let carFlashMaskCanvas = null;
  function getCarFlashMaskCanvas() {
    if (!carFlashMaskCanvas) {
      carFlashMaskCanvas = document.createElement('canvas');
      carFlashMaskCanvas.width = CAR_DISPLAY_WIDTH;
      carFlashMaskCanvas.height = CAR_DISPLAY_HEIGHT;
    }
    return carFlashMaskCanvas;
  }

  // Advances every car's transient impact-feedback timers/particles and
  // ambient smoke. Runs unconditionally every frame, including after the
  // game has ended, so the wreck's smoke keeps animating on the frozen
  // end screen rather than stopping dead.
  function updateCars(dt) {
    for (const car of cars) {
      if (car.shakeTimer > 0) car.shakeTimer = Math.max(0, car.shakeTimer - dt);
      if (car.flashTimer > 0) car.flashTimer = Math.max(0, car.flashTimer - dt);
      if (car.recoilTimer > 0) car.recoilTimer = Math.max(0, car.recoilTimer - dt);
      if (car.particles.length) {
        for (const p of car.particles) {
          p.life += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += (p.isSpark ? 420 : 60) * dt;
        }
        car.particles = car.particles.filter(function(p) { return p.life < p.maxLife; });
      }

      // Ambient smoke + sparks -- only across the mid-damage stages
      // (CAR_SMOKE_START_STAGE..CAR_SMOKE_END_STAGE). New puffs stop
      // spawning once the car reaches CAR_FINAL_STAGE -- the spray cycles
      // take over as the visual there instead; any smoke still in flight
      // just finishes its own natural fade.
      if (car.overallStage >= CAR_SMOKE_START_STAGE && car.overallStage <= CAR_SMOKE_END_STAGE) {
        car.smokeSpawnTimer -= dt;
        if (car.smokeSpawnTimer <= 0) {
          spawnCarSmoke(car);
          car.smokeSpawnTimer += CAR_SMOKE_SPAWN_INTERVAL;
        }
      }
      if (car.smokeParticles.length) {
        for (const p of car.smokeParticles) {
          p.life += dt;
          if (p.isSpark) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 300 * dt;
          } else {
            p.x += (p.vx + Math.sin(p.life * 4 + p.driftSeed) * 10) * dt;
            p.y += p.vy * dt;
            p.frameTimer += dt;
            const smokeFrameDur = 1 / SMOKE_ANIM_FPS;
            while (p.frameTimer >= smokeFrameDur) {
              p.frameTimer -= smokeFrameDur;
              p.frame = (p.frame + 1) % SMOKE_FRAME_COUNT;
            }
          }
        }
        car.smokeParticles = car.smokeParticles.filter(function(p) { return p.life < p.maxLife; });
      }

      // Broken glass shards -- pop off the car, then gravity pulls them
      // down toward the ground while they tumble through their own cycle
      // frames; they simply fade out and get cleaned up once maxLife
      // elapses, rather than needing to detect an exact ground pixel.
      if (car.glassParticles.length) {
        for (const p of car.glassParticles) {
          p.life += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 260 * dt;
          p.rot += p.rotSpeed * dt;
          p.frameTimer += dt;
          const glassFrameDur = 1 / GLASS_ANIM_FPS;
          const frameCount = GLASS_CYCLE_FRAME_COUNTS[p.key];
          while (p.frameTimer >= glassFrameDur) {
            p.frameTimer -= glassFrameDur;
            p.frame = (p.frame + 1) % frameCount;
          }
        }
        car.glassParticles = car.glassParticles.filter(function(p) { return p.life < p.maxLife; });
      }

      // Spray cycles -- only once the car is at the true final stage (the
      // end frame). Rolled once on first arrival so each cycle gets its
      // own random starting frame + fps; from then on they just free-run
      // and loop forever, independently of each other.
      if (car.overallStage === CAR_FINAL_STAGE) {
        if (!car.sprayInited) {
          car.sprayInited = true;
          car.spray1Frame = Math.floor(Math.random() * SPRAY_FRAME_COUNT);
          car.spray1Timer = Math.random() / SPRAY_ANIM_FPS_BASE;
          car.spray1Fps = SPRAY_ANIM_FPS_BASE * (1 + (Math.random() * 2 - 1) * SPRAY_ANIM_FPS_JITTER);
          car.spray2Frame = Math.floor(Math.random() * SPRAY_FRAME_COUNT);
          car.spray2Timer = Math.random() / SPRAY_ANIM_FPS_BASE;
          car.spray2Fps = SPRAY_ANIM_FPS_BASE * (1 + (Math.random() * 2 - 1) * SPRAY_ANIM_FPS_JITTER);
        }
        car.spray1Timer += dt;
        const spray1FrameDur = 1 / car.spray1Fps;
        while (car.spray1Timer >= spray1FrameDur) {
          car.spray1Timer -= spray1FrameDur;
          car.spray1Frame = (car.spray1Frame + 1) % SPRAY_FRAME_COUNT;
        }
        car.spray2Timer += dt;
        const spray2FrameDur = 1 / car.spray2Fps;
        while (car.spray2Timer >= spray2FrameDur) {
          car.spray2Timer -= spray2FrameDur;
          car.spray2Frame = (car.spray2Frame + 1) % SPRAY_FRAME_COUNT;
        }
      }
    }
  }

  function drawCar(car) {
    const sx = carScreenX(car);
    const groundY = canvas.height * GROUND_Y_FRAC;
    const baseY = carBaseY(car, groundY);

    // Static ground shadow -- always present beneath the car, at every
    // damage stage, and deliberately drawn before the shake/recoil
    // translate below so it doesn't jitter/kick with impact hits the way
    // the car sprite itself does; it just sits still on the ground.
    // Centred on the car's actual ground-contact line (the same line
    // carBaseY() anchors every damage stage's art to), so it stays put
    // under the car regardless of which stage's art is showing.
    const shadowImg = ANIMS['car_shadow'] && ANIMS['car_shadow'][0];
    if (shadowImg && shadowImg.complete && shadowImg.naturalWidth > 0) {
      const shadowDrawX = sx - CAR_SHADOW_DISPLAY_WIDTH / 2;
      const shadowDrawY = groundContactY(groundY) - CAR_SHADOW_DISPLAY_HEIGHT / 2 - CAR_SHADOW_Y_OFFSET;
      ctx.drawImage(shadowImg, shadowDrawX, shadowDrawY, CAR_SHADOW_DISPLAY_WIDTH, CAR_SHADOW_DISPLAY_HEIGHT);
    }

    const shakeT = car.shakeTimer / CAR_SHAKE_DURATION;
    const shakeX = car.shakeTimer > 0 ? (Math.random() * 2 - 1) * CAR_SHAKE_MAGNITUDE * shakeT : 0;
    const shakeY = car.shakeTimer > 0 ? (Math.random() * 2 - 1) * CAR_SHAKE_MAGNITUDE * shakeT * 0.5 : 0;
    const recoilT = car.recoilTimer / CAR_RECOIL_DURATION;
    const recoilX = car.recoilTimer > 0 ? car.recoilDir * CAR_RECOIL_DISTANCE * recoilT : 0;

    ctx.save();
    ctx.translate(shakeX + recoilX, shakeY);

    const drawX = sx - CAR_DISPLAY_WIDTH / 2;
    const frames = ANIMS['car_' + car.overallStage];
    if (frames && frames[0] && frames[0].complete && frames[0].naturalWidth > 0) {
      ctx.drawImage(frames[0], drawX, baseY, CAR_DISPLAY_WIDTH, CAR_DISPLAY_HEIGHT);
    }

    // Spray overlays -- same canvas coordinate space as the car art, so
    // drawn at the identical position/size, layered straight on top.
    if (car.overallStage === CAR_FINAL_STAGE) {
      const spray1Frames = ANIMS['spray1'];
      const spray1Img = spray1Frames && spray1Frames[car.spray1Frame];
      if (spray1Img && spray1Img.complete && spray1Img.naturalWidth > 0) {
        ctx.drawImage(spray1Img, drawX, baseY, CAR_DISPLAY_WIDTH, CAR_DISPLAY_HEIGHT);
      }
      const spray2Frames = ANIMS['spray2'];
      const spray2Img = spray2Frames && spray2Frames[car.spray2Frame];
      if (spray2Img && spray2Img.complete && spray2Img.naturalWidth > 0) {
        ctx.drawImage(spray2Img, drawX, baseY, CAR_DISPLAY_WIDTH, CAR_DISPLAY_HEIGHT);
      }
    }

    if (car.flashTimer > 0) {
      const flashT = car.flashTimer / CAR_FLASH_DURATION;
      const flicker = Math.floor(car.flashTimer * 33) % 2 === 0;
      if (flicker) {
        const maskCanvas = getCarFlashMaskCanvas();
        const mctx = maskCanvas.getContext('2d');
        mctx.clearRect(0, 0, CAR_DISPLAY_WIDTH, CAR_DISPLAY_HEIGHT);
        mctx.globalCompositeOperation = 'source-over';
        if (frames && frames[0] && frames[0].complete && frames[0].naturalWidth > 0) {
          mctx.drawImage(frames[0], 0, 0, CAR_DISPLAY_WIDTH, CAR_DISPLAY_HEIGHT);
        }
        mctx.globalCompositeOperation = 'source-atop';
        mctx.fillStyle = '#ffffff';
        mctx.fillRect(0, 0, CAR_DISPLAY_WIDTH, CAR_DISPLAY_HEIGHT);

        ctx.save();
        ctx.globalAlpha = 0.55 * flashT;
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(maskCanvas, drawX, baseY);
        ctx.restore();
      }
    }
    ctx.restore();

    if (car.particles.length) {
      ctx.save();
      for (const p of car.particles) {
        const alpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.isSpark ? '#ffcc33' : '#8a8a82';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.isSpark ? 1 : alpha), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (car.glassParticles.length) {
      ctx.save();
      for (const p of car.glassParticles) {
        const t = Math.min(1, p.life / p.maxLife);
        // Fades out over the last third of its life rather than an abrupt
        // pop, so it visually "vanishes" instead of just disappearing.
        const alpha = 1 - Math.max(0, (t - 0.67) / 0.33);
        const frames = ANIMS[p.key];
        const img = frames && frames[p.frame];
        if (img && img.complete && img.naturalWidth > 0) {
          const dim = GLASS_NATIVE_SIZE[p.key];
          const dw = dim.w * GLASS_DISPLAY_SCALE;
          const dh = dim.h * GLASS_DISPLAY_SCALE;
          ctx.globalAlpha = alpha;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
          ctx.restore();
        }
      }
      ctx.restore();
    }

    if (car.smokeParticles.length) {
      ctx.save();
      const smokeFrames = ANIMS['smoke'];
      for (const p of car.smokeParticles) {
        const t = Math.min(1, p.life / p.maxLife);
        if (p.isSpark) {
          ctx.globalAlpha = Math.max(0, 1 - t) * p.peakAlpha;
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const fadeIn = Math.min(1, t / 0.15);
          const fadeOut = 1 - Math.max(0, (t - 0.15) / 0.85);
          ctx.globalAlpha = fadeIn * fadeOut * p.peakAlpha;
          const img = smokeFrames && smokeFrames[p.frame];
          if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
          }
        }
      }
      ctx.restore();
    }
  }

  function drawCars() {
    for (const car of cars) drawCar(car);
  }

  // ---------------------------------------------------------------
  // Main update logic
  // ---------------------------------------------------------------
  let lastTs = null;

  function update(dt) {
    // Car shake/flash/recoil/particles/smoke keep animating every frame,
    // even after the game has ended -- see updateCars()'s comment. Unlike
    // an earlier build, character input/state is NOT frozen once the game
    // has ended either -- the timer/score are already locked in by
    // triggerGameEnd(), but Stefan stays fully controllable and can keep
    // landing hits on the wreck for as long as the player wants.
    updateCars(dt);

    // Flying Kick: pressing kick while airborne from a running_jump
    // redirects that jump into a flying kick instead of letting the
    // running-jump pose play out.
    if (character.action.indexOf('running_jump_') === 0 && keys.kick) {
      setAction('flying_kick_' + character.facing);
      checkCarHits();
      return;
    }

    // Non-interruptible sequences resolve on their own in animate().
    if (isJumpAction(character.action)) return;
    if (isPunchAction(character.action)) return;
    if (isKickAction(character.action)) return;
    if (isVictoryAction(character.action)) return;

    // Jumping only exists as the running-jump carry-through -- there's no
    // standing-jump art in this build (see header comment), so Space only
    // does anything while already running.
    if (keys.space && isRunningAction(character.action) && character.action.endsWith('_' + character.facing)) {
      setAction('running_jump_' + character.facing);
      return;
    }

    if (keys.punch) {
      setAction(pickVariant(PUNCH_VARIANTS) + '_' + character.facing);
      checkCarHits();
      return;
    }

    if (keys.kick) {
      setAction('high_kick_' + character.facing);
      checkCarHits();
      return;
    }

    if (keys.left || keys.right) {
      applyWalkPress(keys.left, keys.shift);
      return;
    }

    // No input this frame. Fight-stance idle just holds, fully
    // interruptible, until FIGHT_STANCE_HOLD_MIN/MAX_SEC passes with no
    // input at all.
    if (character.action === 'fight_stance_idle_east' || character.action === 'fight_stance_idle_west') {
      if (character.fightStanceTimer >= character.fightStanceThreshold) {
        setAction('stand_south');
      }
      return;
    }

    // No idle mood variety in this build -- just the one static pose.
    setAction('stand_south');
  }

  function animate(dt) {
    const cfg = ANIM_CONFIG[character.action];
    if (!cfg) return;
    const frames = ANIMS[character.action];
    if (!frames || frames.length === 0) return;

    // Horizontal travel: only while actually walking/running east/west
    // (or mid flying-kick) does character.x move. Wraps around the
    // screen edge the instant it fully exits either side -- this is what
    // lets Stefan "walk back and appear on the right" (or vice versa).
    if (isMovingEastWest(character.action)) {
      const speed = (isRunningAction(character.action) || character.action.indexOf('flying_kick_') === 0) ? RUN_SPEED : WALK_SPEED;
      const dir = character.facing === 'east' ? 1 : -1;
      const dx = dir * speed * dt;
      character.x += dx;
      if (character.x - DISPLAY_SIZE / 2 > canvas.width) {
        character.x = -DISPLAY_SIZE / 2;
      } else if (character.x + DISPLAY_SIZE / 2 < 0) {
        character.x = canvas.width + DISPLAY_SIZE / 2;
      }
    }

    character.frameTimer += dt;
    const frameDuration = 1 / cfg.fps;

    if (character.frameTimer >= frameDuration) {
      character.frameTimer -= frameDuration;
      character.frameIndex++;

      if (character.frameIndex >= frames.length) {
        if (cfg.loop) {
          character.frameIndex = 0;
        } else {
          character.frameIndex = frames.length - 1;
          const a = character.action;

          if (isPunchAction(a) || isKickAction(a)) {
            setAction('fight_stance_idle_' + character.facing);
          } else if (isJumpAction(a)) {
            setAction('stand_south');
          } else if (isVictoryAction(a)) {
            setAction('stand_south');
          }
        }
      }
    }
  }

  function jumpYOffset(frames) {
    if (!isJumpAction(character.action) || !frames || frames.length <= 1) return 0;
    const p = character.frameIndex / (frames.length - 1);
    return -character.jumpHeight * 4 * p * (1 - p);
  }

  function currentVerticalOffset() {
    return jumpYOffset(ANIMS[character.action]);
  }

  function drawCharacterFrame(img, x, y, flip, size) {
    size = size || DISPLAY_SIZE;
    if (flip) {
      ctx.save();
      ctx.translate(x + size, y);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, size, size);
      ctx.restore();
    } else {
      ctx.drawImage(img, x, y, size, size);
    }
  }

  function drawStefanCharacter(groundY) {
    const frames = ANIMS[character.action];
    const yOff = currentVerticalOffset();
    drawGroundShadow(character.x, -yOff);

    if (frames && frames.length) {
      const img = frames[character.frameIndex];
      const drawY = groundY - DISPLAY_SIZE / 2 + yOff;
      if (img.complete && img.naturalWidth > 0) {
        drawCharacterFrame(img, character.x - DISPLAY_SIZE / 2, drawY, character.action.endsWith('_west'));
      }
    }
  }

  // ---------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------
  function render() {
    const screenShake = currentScreenShakeOffset();
    ctx.save();
    ctx.translate(screenShake.x, screenShake.y);

    ctx.fillStyle = BG;
    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

    const groundY = canvas.height * GROUND_Y_FRAC;

    drawCars();
    drawStefanCharacter(groundY);

    if (startTime && !gameEnded) {
      hud.textContent = formatTime(Date.now() - startTime);
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------
  function loop(ts) {
    if (lastTs === null) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTs = ts;

    if (introPlaying) {
      introUpdate(dt);
      animate(dt);
    } else {
      update(dt);
      animate(dt);
    }
    render();

    requestAnimationFrame(loop);
  }

  // The car is already spawned (see `cars` above), so the very first
  // frame drawn -- before the player has even clicked to begin -- already
  // shows it sitting in position, with Stefan just off-screen to the
  // left, exactly what the real intro will show a moment later.
  function drawPoster() {
    const carFrames = ANIMS['car_1'];
    if (carFrames && carFrames.length && carFrames[0].complete) {
      render();
    } else {
      requestAnimationFrame(drawPoster);
    }
  }
  drawPoster();

})();
</script>
</body>
</html>
