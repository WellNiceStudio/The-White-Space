<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The White Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f5f5;
    --ink: #212121;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    outline: none; /* body is focusable (tabindex) for reliable keyboard capture; hide the focus ring */
  }
  #gameCanvas {
    display: block;
    background: var(--bg);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* ---------- Start Screen ---------- */
  #startScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    padding: 24px;
    box-sizing: border-box;
  }
  #startScreen .welcome-tag {
    font-size: clamp(10px, 1.8vw, 13px);
    letter-spacing: 2px;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 10px;
  }
  #startScreen h1 {
    font-size: clamp(20px, 5vw, 42px);
    letter-spacing: 4px;
    margin: 0 0 28px 0;
    color: var(--ink);
    line-height: 1.6;
  }
  #startScreen .byline {
    font-size: clamp(9px, 1.6vw, 12px);
    line-height: 2.2;
    max-width: 560px;
    color: var(--ink);
    opacity: 0.85;
    margin-bottom: 40px;
  }
  #startScreen .prompt {
    font-size: clamp(10px, 1.8vw, 13px);
    color: var(--ink);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--ink);
    z-index: 5;
    opacity: 0.75;
  }

  /* ---------- Mobile touch controls ---------- */
  /* Hidden by default; JS adds .visible only on touch-capable devices,
     so desktop play is completely unaffected. */
  /* Fully responsive layout: every size below derives from clamp()/vmin
     so the controls scale smoothly between small phones and large
     tablets instead of using fixed pixel values. vmin (the smaller of
     viewport width/height) is used rather than vw so the controls stay
     the same physical size whether the device is in portrait or
     landscape -- vw alone would balloon in landscape since width grows
     while thumb size doesn't. */
  #touchControls {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    /* Safe-area insets (notches/rounded corners) plus a comfortable
       responsive margin on top, so controls never sit under a notch
       or right at the physical screen edge on any device. */
    padding-left: calc(env(safe-area-inset-left, 0px) + clamp(16px, 5vmin, 40px));
    padding-right: calc(env(safe-area-inset-right, 0px) + clamp(16px, 5vmin, 40px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(12px, 4vmin, 28px));
    box-sizing: border-box;
    z-index: 10;
    justify-content: space-between; /* d-pad bottom-left, actions bottom-right */
    align-items: flex-end;
    pointer-events: none; /* re-enabled on the individual controls below */
    opacity: 0.92; /* sits gently into the minimalist scene rather than fighting the art */
  }
  #touchControls.visible {
    display: flex;
  }
  .tc-dpad {
    /* Group target: roughly 15-20% of the viewport's shorter side on
       typical phones/tablets (20vmin), floored at 120px so it's never
       too small to use comfortably on the smallest phones, and capped
       at 220px so it never dominates a large tablet screen. */
    --dpad: clamp(120px, 20vmin, 220px);
    position: relative;
    width: var(--dpad);
    height: var(--dpad);
    pointer-events: auto;
  }
  /* Each direction is its own real button: an invisible hit area sized
     at ~30% of the d-pad (generous tap target), with the visible
     rounded bar centered inside it -- the tappable area is bigger than
     what you see, for comfortable mobile tapping. The hit-area-to-gap
     ratio is preserved at every size since both scale off --dpad.
     Full opacity by default, dimmed to 50% while pressed (JS toggles
     .active -- see bindTouchButton); each button dims independently. */
  .tc-dir-btn {
    position: absolute;
    width: calc(var(--dpad) * 0.304);
    height: calc(var(--dpad) * 0.304);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .tc-dir {
    display: block;
    object-fit: contain; /* never stretched, whatever box it lands in */
    opacity: 1;
    pointer-events: none;
  }
  .tc-dir-btn.active .tc-dir {
    opacity: 0.5;
  }
  /* aspect-ratio locks each bar to the source graphic's true 4:1
     proportions (a 16x4 rounded rect) -- only one dimension is driven
     by --dpad and the other follows automatically, so the art can
     never be stretched or squashed at any screen size. */
  .tc-dir-btn.tc-left  .tc-dir,
  .tc-dir-btn.tc-right .tc-dir {
    width: calc(var(--dpad) * 0.304);
    height: auto;
    aspect-ratio: 4 / 1;
  }
  .tc-dir-btn.tc-up  .tc-dir,
  .tc-dir-btn.tc-down .tc-dir {
    height: calc(var(--dpad) * 0.304);
    width: auto;
    aspect-ratio: 1 / 4;
  }
  .tc-dir-btn.tc-left,
  .tc-dir-btn.tc-right {
    top: 50%;
    transform: translateY(-50%);
  }
  .tc-dir-btn.tc-up,
  .tc-dir-btn.tc-down {
    left: 50%;
    transform: translateX(-50%);
  }
  .tc-dir-btn.tc-left  { left: 0; }
  .tc-dir-btn.tc-right { right: 0; }
  .tc-dir-btn.tc-up    { top: 0; }
  .tc-dir-btn.tc-down  { bottom: 0; }
  /* Run and Jump: two identical circular buttons, side by side, with
     spacing that scales with button size so they never feel cramped
     enough to risk an accidental press. Each is a small stack -- the
     stroke ring stays at full opacity always, while the fill button
     dims to 50% while pressed. */
  .tc-actions {
    --action: clamp(44px, 9vmin, 72px);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: calc(var(--action) * 0.5);
    pointer-events: auto;
  }
  .tc-action-btn {
    position: relative;
    width: var(--action);
    height: var(--action);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .tc-btn-stroke {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1; /* button-stroke.svg is a true circle -- never stretched */
    object-fit: contain;
    opacity: 1; /* always full opacity, regardless of press state */
    pointer-events: none;
  }
  .tc-btn-fill {
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(var(--action) * 0.84); /* matches button.svg's 20/24 ratio against the stroke */
    height: calc(var(--action) * 0.84);
    aspect-ratio: 1 / 1; /* button.svg is a true circle -- never stretched */
    object-fit: contain;
    transform: translate(-50%, -50%);
    opacity: 1;
    pointer-events: none;
  }
  .tc-action-btn.active .tc-btn-fill {
    opacity: 0.5;
  }
</style>
</head>

<script>
(function() {
  "use strict";

  // ---------------------------------------------------------------
  // Setup canvas
  // ---------------------------------------------------------------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const BG = '#f5f5f5';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------
  // Keyboard focus safety net: if this page is embedded/iframed (e.g.
  // after uploading it somewhere), keydown events won't reach it at all
  // until the page/frame actually has focus. Grab focus as early as
  // possible, and again on the first click/tap anywhere on the page, so
  // "press any key to begin" reliably works regardless of hosting context.
  // ---------------------------------------------------------------
  function grabFocus() {
    try { window.focus(); } catch (err) {}
    try { document.body.focus(); } catch (err) {}
  }
  grabFocus();
  window.addEventListener('load', grabFocus);
  document.addEventListener('click', grabFocus);
  document.addEventListener('touchstart', grabFocus);

  // ---------------------------------------------------------------
  // Load sprites into Image objects
  // ---------------------------------------------------------------
  const ANIMS = {};

  Object.keys(SPRITES_RAW).forEach(function(key) {
    ANIMS[key] = SPRITES_RAW[key].map(function(dataUri) {
      const img = new Image();
      img.src = dataUri;
      return img;
    });
  });

  // stand_south: a frozen single frame (first frame of the breathing idle),
  // used briefly before a full idle loop kicks in -- same trick as before,
  // and also what every "no dedicated recovery art" action (fall, crouch
  // release, jump landing) settles back onto.
  ANIMS['stand_south'] = ANIMS['idle_breathing_south'] ? [ANIMS['idle_breathing_south'][0]] : [];

  // The laptop is a fixed fixture, not part of Stefan's own action set --
  // loaded the same way, into its own small table. See the "Laptop"
  // section further down for how its on-screen position is derived.
  const LAPTOP_FRAMES = (SPRITES_RAW['object_laptop'] || []).map(function(dataUri) {
    const img = new Image();
    img.src = dataUri;
    return img;
  });

  // ---------------------------------------------------------------
  // Animation config: fps per action, loop behaviour
  // ---------------------------------------------------------------
  const ANIM_CONFIG = {
    walk_south:           { fps: 8,  loop: true  },
    walk_east:            { fps: 8,  loop: true  },
    walk_west:            { fps: 8,  loop: true  },
    running_south:        { fps: 14, loop: true  },
    running_east:         { fps: 14, loop: true  },
    running_west:         { fps: 14, loop: true  },
    stand_south:          { fps: 1,  loop: true  },
    idle_breathing_south: { fps: 4,  loop: true  },
    idle_phone_south:     { fps: 8,  loop: true  },
    idle_worn_out_south:  { fps: 8,  loop: true  },
    crouching_east:       { fps: 8,  loop: false },
    crouching_west:       { fps: 8,  loop: false },
    falling_east:         { fps: 20, loop: false },
    falling_west:         { fps: 20, loop: false },
    jump_a_east:          { fps: 14, loop: false },
    jump_a_west:          { fps: 14, loop: false },
    jump_b_east:          { fps: 14, loop: false },
    jump_b_west:          { fps: 14, loop: false },
    running_jump_east:    { fps: 16, loop: false },
    running_jump_west:    { fps: 16, loop: false },
    look_up_east:         { fps: 10, loop: false },
    look_up_west:         { fps: 10, loop: false }
  };

  // ---------------------------------------------------------------
  // Pools -- most actions ship exactly one pose per direction, so
  // there's nothing to pick between. Only idle (3 interchangeable
  // moods) and jump (2 interchangeable poses, when not already
  // running) are pools.
  // ---------------------------------------------------------------
  const IDLE_VARIANTS = ['idle_breathing_south', 'idle_phone_south', 'idle_worn_out_south'];
  const JUMP_VARIANTS = ['jump_a', 'jump_b'];

  function pickVariant(pool) {
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // Action-family checks, used throughout update()/animate() instead of
  // repeating the same indexOf/endsWith checks inline.
  function isRunningAction(action) {
    return action.indexOf('running_') === 0;
  }

  function isWalkOrRunAction(action) {
    return action.indexOf('walk_') === 0 || isRunningAction(action);
  }

  // Walking or running east/west specifically -- the only two directions
  // that actually move character.x (south walk/run is stationary).
  function isMovingEastWest(action) {
    return isWalkOrRunAction(action) && !action.endsWith('_south');
  }

  function isJumpAction(action) {
    return action.indexOf('jump_') === 0 || action.indexOf('running_jump_') === 0;
  }

  function isFallingAction(action) {
    return action.indexOf('falling_') === 0;
  }

  function isLookUpAction(action) {
    return action.indexOf('look_up_') === 0;
  }

  // idle_worn_out_south (17 frames, indices 0-16) plays start to finish
  // once, then instead of restarting from frame 1 it settles into looping
  // just frames 13-17 (indices 12-16, i.e. through to the very last
  // frame) for as long as Stefan stays idle -- see the frame-advance
  // logic in animate() and the wornOutIntroDone reset in setAction().
  const WORN_OUT_LOOP_START = 12;
  const WORN_OUT_LOOP_END = 16;

  // idle_phone_south (17 frames, indices 0-16) plays only up through frame
  // 13 (index 12) the first time, then loops just frames 11-13 (indices
  // 10-12) instead of continuing on to the rest of the animation. Frames
  // 14-17 (indices 13-16) are never shown while looping -- they're held in
  // reserve as the "exit" tail: the first real input while looping marks
  // phoneExitPending, which lets the animation advance straight through
  // past frame 13 for the first time (14, 15, 16, 17) instead of wrapping
  // back to frame 11 -- only once it reaches the true end does the
  // player's input actually take effect (see the non-interruptible guard
  // and the deferred-input check in update(), and the frame-advance
  // handling in animate()).
  const PHONE_LOOP_START = 10;
  const PHONE_LOOP_END = 12;

  // look_up_east/west (7 frames, indices 0-6) plays frames 1-2 normally,
  // then holds on frame 3 (index 2) for as long as the look-up key stays
  // held -- releasing it lets the rest of the cycle (frames 4-7) play out
  // to completion before control returns to the game. See the hold check
  // in animate() and the matching non-interruptible guard in update().
  const LOOK_UP_HOLD_FRAME_INDEX = 2;

  // ---------------------------------------------------------------
  // Character state
  // ---------------------------------------------------------------
  const DISPLAY_SIZE = 220;
  const WALK_SPEED = 140;  // px/sec, screen-space horizontal travel while walking east/west
  const RUN_SPEED = 300;   // px/sec while running east/west

  // ---------------------------------------------------------------
  // Laptop: a single fixed fixture sitting on the floor right where
  // Stefan starts. The art is authored at the same 240x240 native
  // resolution as Stefan's own sprites, with the laptop already
  // positioned/grounded within that frame the same way his art is -- so
  // it's drawn at the exact same DISPLAY_SIZE and centered on groundY
  // with the exact same formula as the character (see render()), and
  // that alone is enough for their bottom pixels to line up.
  //
  // Unlike character.x (screen-space, teleport-wraps at the edges), the
  // laptop's screen position is derived from character.worldX -- a
  // plain, never-wrapping running total of how far Stefan has actually
  // walked/run east/west since the game began (see the horizontal-travel
  // block in animate()). That keeps the laptop itself perfectly simple:
  // it never moves in world space, so as Stefan walks away in either
  // direction it scrolls off screen and out of view, and walking back the
  // other way by the same amount always brings it back to exactly where
  // it started -- see render() for the actual screen-position formula.
  //
  // Its world offset is a couple of screen-widths west of spawn (not
  // right next to Stefan), so it stays out of view at the start and only
  // scrolls into frame once he's walked far enough west to reach it --
  // and walking east instead just takes him further away from it.
  // ---------------------------------------------------------------
  const LAPTOP_DISPLAY_SIZE = DISPLAY_SIZE; // same on-screen size as Stefan -- art matches his native resolution
  const LAPTOP_WORLD_OFFSET = -canvas.width * 2.5; // a couple of screens west of spawn
  const LAPTOP_FPS = 8; // its screen-switching animation just loops continuously, always, regardless of Stefan's state

  const character = {
    x: canvas.width / 2,   // real screen-space horizontal position; only walk_east/west
                            // and running_east/west ever move it -- south stays in place
    worldX: 0,              // never-wrapping running total of net east/west travel since
                             // spawn (positive = net east, negative = net west) -- purely
                             // for positioning fixed world fixtures like the laptop; not
                             // used for anything else, and never reset by the x wraparound
    facing: 'east',        // 'east' | 'west' -- last real left/right press; used for
                            // crouch/jump/look-up art, all of which only ship e/w poses
    action: 'walk_south',
    frameIndex: 0,
    frameTimer: 0,
    jumpHeight: 70,
    crouchHeld: false,
    stillTimer: 0,
    idleThreshold: 1,      // reroll each time stillTimer resets -- brief stand_south pause before idling
    idleMood: 'idle_breathing_south', // held for the whole idle session, rerolled only when a fresh one starts
    wornOutIntroDone: false, // true once idle_worn_out_south has played its full 17 frames this session; from then on it loops only WORN_OUT_LOOP_START..END (see animate())
    phoneIntroDone: false,  // true once idle_phone_south has played its full 17 frames this session; from then on it loops only PHONE_LOOP_START..END (see animate())
    phoneExitPending: false, // true once real input has been seen while looping the phone-idle tail -- update() stays locked out and animate() lets the cycle play to its true end before the input takes effect
    tripHoldTimer: null,   // set to 0 once a fall's animation finishes; counts up to FALL_HOLD_SEC before snapping back
    // Two independent "spontaneous roll" mechanisms, both driven by the
    // shared rollChance() helper below:
    //   tripRoll    -- while walking/running east or west, a chance per
    //                  second to trigger a fall (falling_east/west only
    //                  exists for e/w, so this never fires facing south)
    //   attractRoll -- only during the pre-interaction south loop, a
    //                  chance per second to toggle between walk_south and
    //                  running_south for variety
    tripRoll: { last: -Infinity, accum: 0 },
    attractRoll: { last: -Infinity, accum: 0 }
  };

  let hasInteracted = false; // once true, walk_south/running_south never play again -- south is retired to idle-only

  // Laptop's own screen-switching frame loop -- entirely independent of
  // Stefan's action/state, always advancing (see the top of animate()).
  const laptop = { frameIndex: 0, frameTimer: 0 };

  function setAction(action) {
    if (character.action === action) return;
    character.action = action;
    character.frameIndex = 0;
    character.frameTimer = 0;
    if (action === 'idle_worn_out_south') {
      // fresh worn-out idle session -- play the full animation again
      // before settling back into the frames 13-17 tail loop
      character.wornOutIntroDone = false;
    }
    if (action === 'idle_phone_south') {
      // fresh phone-idle session -- play the full animation again before
      // settling back into the frames 11-13 tail loop
      character.phoneIntroDone = false;
      character.phoneExitPending = false;
    }
  }

  function resetStillTimer() {
    character.stillTimer = 0;
    character.idleThreshold = 1 + Math.random(); // 1-2s
  }

  // ---------------------------------------------------------------
  // Input handling
  // ---------------------------------------------------------------
  const keys = {
    left: false, right: false, down: false, up: false, space: false, shift: false
  };

  let gameStarted = false;

  function beginGame() {
    if (gameStarted) return;
    gameStarted = true;
    document.getElementById('startScreen').style.display = 'none';
    startTime = Date.now();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function(e) {
    if (!gameStarted) { beginGame(); return; }
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': keys.left = true; e.preventDefault(); break;
      case 'ArrowRight': case 'KeyD': keys.right = true; e.preventDefault(); break;
      case 'ArrowDown': case 'KeyS': keys.down = true; e.preventDefault(); break;
      case 'ArrowUp': case 'KeyW': keys.up = true; e.preventDefault(); break;
      case 'Space': keys.space = true; e.preventDefault(); break;
      case 'ShiftLeft': case 'ShiftRight': keys.shift = true; break;
    }
  });

  window.addEventListener('keyup', function(e) {
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': keys.left = false; break;
      case 'ArrowRight': case 'KeyD': keys.right = false; break;
      case 'ArrowDown': case 'KeyS': keys.down = false; break;
      case 'ArrowUp': case 'KeyW': keys.up = false; break;
      case 'Space': keys.space = false; break;
      case 'ShiftLeft': case 'ShiftRight': keys.shift = false; break;
    }
  });

  document.getElementById('startScreen').addEventListener('click', beginGame);
  document.getElementById('startScreen').addEventListener('touchstart', beginGame);

  // ---------------------------------------------------------------
  // Mobile touch controls: only shown on touch-capable devices. Each
  // button just sets the same `keys.*` flags the keyboard handlers use
  // above, so every movement/jump/crouch/look-up/run rule works
  // completely unchanged -- this is purely an extra input source.
  // ---------------------------------------------------------------
  const touchControls = document.getElementById('touchControls');
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouchDevice && touchControls) {
    touchControls.classList.add('visible');
  }

  function bindTouchButton(el) {
    const key = el.getAttribute('data-key');
    function press(e) {
      e.preventDefault();
      el.classList.add('active');
      if (!gameStarted) { beginGame(); return; }
      keys[key] = true;
      grabFocus();
    }
    function release(e) {
      e.preventDefault();
      el.classList.remove('active');
      keys[key] = false;
    }
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  }
  if (touchControls) {
    const buttons = touchControls.querySelectorAll('[data-key]');
    for (let i = 0; i < buttons.length; i++) bindTouchButton(buttons[i]);
  }

  // ---------------------------------------------------------------
  // Timer
  // ---------------------------------------------------------------
  let startTime = null;
  const hud = document.getElementById('hud');

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  // ---------------------------------------------------------------
  // Shared "cooldown, then a per-second chance once it clears" roll,
  // used for both the trip mechanic and the pre-interaction walk/run
  // toggle (see tripRoll/attractRoll on character).
  // ---------------------------------------------------------------
  function rollChance(state, cooldownSec, chancePerSec, dt, elapsedSec) {
    if (elapsedSec - state.last < cooldownSec) return false;
    state.accum += dt;
    while (state.accum >= 1) {
      state.accum -= 1;
      if (Math.random() < chancePerSec) {
        state.last = elapsedSec;
        return true;
      }
    }
    return false;
  }

  const TRIP_COOLDOWN_SEC = 15;
  const TRIP_CHANCE_PER_SEC = 0.05;
  const FALL_HOLD_SEC = 1.5; // how long Stefan stays down before snapping back up
  const ATTRACT_TOGGLE_COOLDOWN_SEC = 15;
  const ATTRACT_TOGGLE_CHANCE_PER_SEC = 0.05;

  // ---------------------------------------------------------------
  // Main update logic
  // ---------------------------------------------------------------
  let lastTs = null;

  function update(dt) {
    const elapsedSec = startTime ? (Date.now() - startTime) / 1000 : 0;

    // Non-interruptible sequences resolve on their own in animate().
    if (isJumpAction(character.action)) return;
    if (isFallingAction(character.action)) return;
    // idle_phone_south's tail loop, once real input has been seen, plays
    // itself out to the true end of the cycle before that input is
    // allowed to take effect (see the deferred-input check below and the
    // frame-advance handling in animate()).
    if (character.action === 'idle_phone_south' && character.phoneExitPending) return;
    // look_up: once it's reached its held frame (frame 3), the rest of
    // the cycle -- the hold itself, plus playing out frames 4-7 once the
    // key is released -- is non-interruptible, same idea as jump/falling.
    // Frames 1-2 stay interruptible as before (nothing to guard yet).
    if (isLookUpAction(character.action) && character.frameIndex >= LOOK_UP_HOLD_FRAME_INDEX) return;

    if (character.crouchHeld) {
      if (!keys.down) {
        // no dedicated "getting up from crouch" art -- snap straight back
        character.crouchHeld = false;
        resetStillTimer();
        setAction('stand_south');
      }
      return;
    }

    // While looping the phone-idle tail (frames 11-13), the first real
    // input doesn't act immediately -- it just marks the cycle to finish
    // playing out to the end first (see animate()). Once phoneIntroDone
    // flips back to false there, update() falls through to the normal
    // branches below on its own, re-reading whatever's still held then.
    if (character.action === 'idle_phone_south' && character.phoneIntroDone && !character.phoneExitPending) {
      if (keys.down || keys.space || keys.left || keys.right) {
        character.phoneExitPending = true;
        return;
      }
    }

    // Spontaneous trip: only while actually walking or running east/west
    // (falling_east/west is the only mishap art, so this can never fire
    // facing south).
    if (isWalkOrRunAction(character.action) && character.action.endsWith('_' + character.facing)) {
      if (rollChance(character.tripRoll, TRIP_COOLDOWN_SEC, TRIP_CHANCE_PER_SEC, dt, elapsedSec)) {
        setAction('falling_' + character.facing);
        resetStillTimer();
        return;
      }
    }

    if (keys.down) {
      hasInteracted = true;
      character.crouchHeld = true;
      setAction('crouching_' + character.facing);
      resetStillTimer();
      return;
    }

    if (keys.space) {
      hasInteracted = true;
      // Jump straight out of a run keeps the running jump pose; otherwise
      // it's a random pick between the two standing jump poses.
      if (isRunningAction(character.action) && character.action.endsWith('_' + character.facing)) {
        setAction('running_jump_' + character.facing);
      } else {
        setAction(pickVariant(JUMP_VARIANTS) + '_' + character.facing);
      }
      resetStillTimer();
      return;
    }

    if (keys.up) {
      // look_up only ships east/west art -- while Stefan is currently in
      // a south-facing action (idling, or the pre-interaction walk/run
      // loop), there's nothing to switch to, so this is simply a no-op
      // rather than snapping to a stale left/right facing.
      if (!character.action.endsWith('_south')) {
        hasInteracted = true;
        setAction('look_up_' + character.facing);
        resetStillTimer();
      }
      return;
    }

    if (keys.left || keys.right) {
      hasInteracted = true;
      character.facing = keys.left ? 'west' : 'east';
      setAction((keys.shift ? 'running_' : 'walk_') + character.facing);
      resetStillTimer();
      return;
    }

    // No input this frame.
    if (!hasInteracted) {
      // Pre-interaction attract loop: Stefan walks south in place,
      // occasionally toggling to running south for variety, forever,
      // until the first real key press. Stationary -- south movement
      // never touches character.x.
      if (rollChance(character.attractRoll, ATTRACT_TOGGLE_COOLDOWN_SEC, ATTRACT_TOGGLE_CHANCE_PER_SEC, dt, elapsedSec)) {
        setAction(character.action === 'walk_south' ? 'running_south' : 'walk_south');
      } else if (character.action !== 'walk_south' && character.action !== 'running_south') {
        setAction('walk_south');
      }
      return;
    }

    // After the first interaction, standing still always resolves to a
    // south-facing idle -- no more walk_south/running_south once real
    // play has begun.
    character.stillTimer += dt;
    if (character.stillTimer <= character.idleThreshold) {
      setAction('stand_south');
    } else {
      if (!IDLE_VARIANTS.includes(character.action)) {
        character.idleMood = pickVariant(IDLE_VARIANTS);
      }
      setAction(character.idleMood);
    }
  }

  function animate(dt) {
    // The laptop just loops its screen-switching animation forever, on its
    // own clock, completely independent of whatever Stefan is doing.
    if (LAPTOP_FRAMES.length > 1) {
      laptop.frameTimer += dt;
      const laptopFrameDuration = 1 / LAPTOP_FPS;
      if (laptop.frameTimer >= laptopFrameDuration) {
        laptop.frameTimer -= laptopFrameDuration;
        laptop.frameIndex = (laptop.frameIndex + 1) % LAPTOP_FRAMES.length;
      }
    }

    // Falling: hold on the last frame for FALL_HOLD_SEC once the
    // animation finishes, then snap straight back (no dedicated
    // "getting up" art this time).
    if (character.tripHoldTimer !== null) {
      character.tripHoldTimer += dt;
      if (character.tripHoldTimer >= FALL_HOLD_SEC) {
        character.tripHoldTimer = null;
        resetStillTimer();
        setAction('stand_south');
      }
      return;
    }

    // look_up: freeze on frame 3 for as long as the look-up key stays
    // held. frameTimer isn't touched either, so there's no catch-up burst
    // once released -- it just resumes the normal frame-timer countdown
    // from here on frame 4.
    if (isLookUpAction(character.action) && character.frameIndex === LOOK_UP_HOLD_FRAME_INDEX && keys.up) {
      return;
    }

    const cfg = ANIM_CONFIG[character.action];
    if (!cfg) return;
    const frames = ANIMS[character.action];
    if (!frames || frames.length === 0) return;

    // Horizontal travel: only while actually walking/running east or
    // west does character.x move. Wraps around the screen edge the
    // instant the character fully exits it on either side.
    if (isMovingEastWest(character.action)) {
      const speed = isRunningAction(character.action) ? RUN_SPEED : WALK_SPEED;
      const dir = character.facing === 'east' ? 1 : -1;
      character.x += dir * speed * dt;
      character.worldX += dir * speed * dt; // never wraps -- see the comment on worldX above
      if (character.x - DISPLAY_SIZE / 2 > canvas.width) {
        character.x = -DISPLAY_SIZE / 2;
      } else if (character.x + DISPLAY_SIZE / 2 < 0) {
        character.x = canvas.width + DISPLAY_SIZE / 2;
      }
    }

    character.frameTimer += dt;
    const frameDuration = 1 / cfg.fps;

    if (character.frameTimer >= frameDuration) {
      character.frameTimer -= frameDuration;
      character.frameIndex++;

      if (character.action === 'idle_worn_out_south') {
        // Special bounded loop: play the full 17 frames through once,
        // then loop only frames 13-17 (indices 12-16) forever, instead of
        // restarting from frame 1 -- see WORN_OUT_LOOP_START/END above.
        if (!character.wornOutIntroDone) {
          if (character.frameIndex >= frames.length) {
            character.wornOutIntroDone = true;
            character.frameIndex = WORN_OUT_LOOP_START;
          }
        } else if (character.frameIndex > WORN_OUT_LOOP_END) {
          character.frameIndex = WORN_OUT_LOOP_START;
        }
      } else if (character.action === 'idle_phone_south') {
        // Plays 0..12 (frames 1-13) once, then wraps to PHONE_LOOP_START
        // and keeps looping 10-12 (frames 11-13) -- frames 13-16 are never
        // reached while looping. The very first wrap marks phoneIntroDone
        // so update() knows it's safe to start deferring input (see
        // update()'s check). Once real input sets phoneExitPending, this
        // same bound check is skipped entirely, so frameIndex just keeps
        // counting up past PHONE_LOOP_END for the first time -- straight
        // through frames 14-17 to the true end -- before completing.
        if (character.phoneExitPending) {
          if (character.frameIndex >= frames.length) {
            character.frameIndex = frames.length - 1;
            character.phoneIntroDone = false;
            character.phoneExitPending = false;
          }
        } else if (character.frameIndex > PHONE_LOOP_END) {
          character.phoneIntroDone = true;
          character.frameIndex = PHONE_LOOP_START;
        }
      } else if (character.frameIndex >= frames.length) {
        if (cfg.loop) {
          character.frameIndex = 0;
        } else {
          character.frameIndex = frames.length - 1;
          const a = character.action;

          if (isFallingAction(a)) {
            character.tripHoldTimer = 0;
          } else if (isJumpAction(a) || isLookUpAction(a)) {
            resetStillTimer();
            setAction('stand_south');
          }
        }
      }
    }
  }

  function jumpYOffset(frames) {
    if (!isJumpAction(character.action) || !frames || frames.length <= 1) return 0;
    const p = character.frameIndex / (frames.length - 1);
    return -character.jumpHeight * 4 * p * (1 - p);
  }

  // ---------------------------------------------------------------
  // Render — Stefan has a real horizontal position now (character.x),
  // not a fixed dead-centre spot; only south-facing actions (which never
  // move him) stay centered by virtue of x never having changed.
  // ---------------------------------------------------------------
  function render() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const groundY = canvas.height * 0.62;

    // Laptop draws first (underneath Stefan, so he walks in front of it),
    // fixed in world space -- its screen position is just its fixed world
    // offset minus however far Stefan has net travelled since spawn. Same
    // size and same centered-on-groundY formula as the character himself
    // (see below) -- the art is pre-positioned/grounded within its own
    // 240x240 frame the same way his is, so matching his exact draw
    // formula is all that's needed for their bottom pixels to align.
    if (LAPTOP_FRAMES.length) {
      const laptopImg = LAPTOP_FRAMES[laptop.frameIndex];
      const laptopScreenX = canvas.width / 2 + LAPTOP_WORLD_OFFSET - character.worldX;
      if (laptopImg.complete && laptopImg.naturalWidth > 0) {
        ctx.drawImage(laptopImg, laptopScreenX - LAPTOP_DISPLAY_SIZE / 2, groundY - LAPTOP_DISPLAY_SIZE / 2, LAPTOP_DISPLAY_SIZE, LAPTOP_DISPLAY_SIZE);
      }
    }

    const frames = ANIMS[character.action];
    if (frames && frames.length) {
      const img = frames[character.frameIndex];
      const yOff = jumpYOffset(frames);
      const drawY = groundY - DISPLAY_SIZE / 2 + yOff;

      if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, character.x - DISPLAY_SIZE / 2, drawY, DISPLAY_SIZE, DISPLAY_SIZE);
      }
    }

    if (startTime) {
      hud.textContent = formatTime(Date.now() - startTime);
    }
  }

  // ---------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------
  function loop(ts) {
    if (lastTs === null) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    if (dt > 0.1) dt = 0.1; // clamp on tab refocus etc.
    lastTs = ts;

    update(dt);
    animate(dt);
    render();

    requestAnimationFrame(loop);
  }

  // Draw an initial walk_south frame behind the start screen so it's not blank
  function drawPoster() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const frames = ANIMS['walk_south'];
    if (frames && frames.length && frames[0].complete) {
      const groundY = canvas.height * 0.62;
      if (LAPTOP_FRAMES.length && LAPTOP_FRAMES[0].complete) {
        const laptopScreenX = canvas.width / 2 + LAPTOP_WORLD_OFFSET; // worldX is still 0 pre-game
        ctx.drawImage(LAPTOP_FRAMES[0], laptopScreenX - LAPTOP_DISPLAY_SIZE / 2, groundY - LAPTOP_DISPLAY_SIZE / 2, LAPTOP_DISPLAY_SIZE, LAPTOP_DISPLAY_SIZE);
      }
      ctx.drawImage(frames[0], canvas.width / 2 - DISPLAY_SIZE / 2, groundY - DISPLAY_SIZE / 2, DISPLAY_SIZE, DISPLAY_SIZE);
    } else {
      requestAnimationFrame(drawPoster);
    }
  }
  drawPoster();

})();
</script>
</body>
</html>
